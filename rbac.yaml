apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-troubleshooter
  namespace: k8s-ai-troubleshooter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-troubleshooter-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "pods/log", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-troubleshooter-reader-binding
subjects:
  - kind: ServiceAccount
    name: k8s-troubleshooter
    namespace: k8s-ai-troubleshooter
roleRef:
  kind: ClusterRole
  name: k8s-troubleshooter-reader
  apiGroup: rbac.authorization.k8s.io
